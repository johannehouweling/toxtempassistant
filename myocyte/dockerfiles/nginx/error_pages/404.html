<!doctype html>
<html lang="en">

        display: flex;
        align-items: center;
        justify-content: center;
        border-radius: .5rem;
      }
      .brand-link { color: #fff; text-decoration: none; }

      main.center-viewport { min-height: calc(100vh - 28vh); }

    <!-- Full-screen centered layout: header and message centered on page -->
    <div class="d-flex flex-column align-items-center justify-content-center min-vh-100">

            <h2 class="m-5 fg-white fs-3xl" id="id_headline"><a href="/" class="text-decoration-none fg-white"><i class="bi bi-clipboard-heart me-3"></i><b>ToxTemp</b>Assistant</a></h2>
          </a>
        </div>
      </div>

      <div class="my-7"></div>

        <h1 class="fs-6xl fw-light fg-danger">404</h1>

        <p class="fs-lg fw-light fg-secondary">The requested resource could not be found.</p>
