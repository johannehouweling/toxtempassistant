# Rotates the logs in the shared logs folder, mounted at /logs (./myocyte/logs on
# the legacy server). Run from cron by entrypoint.sh.
#
# Gunicorn keeps its log files open, so copytruncate rotates them in place.
# django-errors.log is left out: Django rotates it itself (settings.LOGGING).
# The logs folder is owned by root and may be group-writable, hence `su`.
/logs/gunicorn-access.log /logs/gunicorn-error.log /logs/backup-cron.log {
    su root root
    size 50M
    rotate 5
    compress
    missingok
    notifempty
    copytruncate
}
